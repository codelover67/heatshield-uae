<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeatShield UAE</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>HeatShield UAE</h1>

  <label for="city">City:</label>
  <select id="city">
    <option value="25.2048,55.2708">Dubai</option>
    <option value="24.4539,54.3773">Abu Dhabi</option>
    <option value="25.3463,55.4209">Sharjah</option>
    <option value="24.2075,55.7447">Al Ain</option>
  </select>
  <br><br>

  <label for="shiftStart">Shift starts at (hour, 0-23):</label>
  <input type="number" id="shiftStart" min="0" max="23" value="8">
  <br><br>

  <label for="shiftEnd">Shift ends at (hour, 0-23):</label>
  <input type="number" id="shiftEnd" min="0" max="23" value="17">
  <br><br>

  <button id="checkBtn">Check my shift</button>

  <p id="status"></p>
  <p id="summary"></p>
  <ul id="results"></ul>

  <script src="js/app.js"></script>
</body>
</html>
